services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cyberlearn
      POSTGRES_PASSWORD: cyberlearn
      POSTGRES_DB: cyberlearn
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyberlearn"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
